<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Receita Medica - Sistema Integrado</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background-color: #f0fdf4; }
        h1 { color: #2c3e50; border-bottom: 2px solid #27ae60; padding-bottom: 10px; }
        .section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; border-left: 5px solid #27ae60; }
        h2 { margin-top: 0; color: #27ae60; font-size: 1.1em; text-transform: uppercase; letter-spacing: 1px; }

        .row { display: flex; gap: 15px; margin-bottom: 15px; }
        .col { flex: 1; }

        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; color: #555; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #eafaf1; color: #27ae60; }

        .actions { text-align: center; margin-top: 30px; }
        button { background-color: #27ae60; color: white; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #219150; }
        button.small { padding: 8px 12px; font-size: 14px; }
        button.add { background-color: #3498db; }
        button.remove { background-color: #e74c3c; padding: 5px 10px; font-size: 12px; }

        .status { padding: 10px; border-radius: 4px; margin-top: 10px; display: none; }
        .status.success { background-color: #d4edda; color: #155724; display: block; }
        .status.error { background-color: #f8d7da; color: #721c24; display: block; }
        .status.loading { background-color: #fff3cd; color: #856404; display: block; }

        .found { background-color: #d4edda !important; }

        .prescricao-form { display: grid; grid-template-columns: 2fr 2fr 1fr auto; gap: 10px; align-items: end; margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 4px; }

        .tabs { display: flex; gap: 0; margin-bottom: 0; }
        .tab { padding: 12px 20px; background: #ddd; border: none; cursor: pointer; font-size: 14px; border-radius: 8px 8px 0 0; }
        .tab.active { background: white; font-weight: bold; color: #27ae60; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .nav-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .nav-buttons a { text-decoration: none; }
        .nav-buttons button { font-size: 14px; padding: 10px 15px; }
        .nav-buttons button.chatbot { background-color: #9b59b6; }
        .nav-buttons button.chatbot:hover { background-color: #8e44ad; }

        .lista-item { padding: 15px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: background 0.2s; }
        .lista-item:hover { background: #f8f9fa; }
        .lista-item strong { color: #27ae60; }
    </style>
</head>
<body>

    <h1>Receita Medica</h1>

    <div class="tabs">
        <button class="tab active" onclick="trocarTab('nova')">Nova Receita</button>
        <button class="tab" onclick="trocarTab('listar')">Listar Receitas</button>
        <button class="tab" onclick="trocarTab('buscar')">Buscar por Numero</button>
        <button class="tab" onclick="trocarTab('cadastrar')">Cadastrar Paciente</button>
    </div>

    <!-- ABA: Nova Receita -->
    <div id="tab-nova" class="tab-content active">
        <div class="section">
            <div class="row">
                <div class="col">
                    <label>Nro. Receita:</label>
                    <input type="text" id="nroReceita" value="Automatico" disabled>
                </div>
                <div class="col">
                    <label>Data Emissao:</label>
                    <input type="date" id="dataEmissao">
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label>Medico Responsavel:</label>
                    <select id="selectMedico">
                        <option value="">-- Carregando medicos... --</option>
                    </select>
                </div>
                <div class="col">
                    <label>CRM:</label>
                    <input type="text" id="crmMedico" readonly placeholder="Selecione um medico...">
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Dados do Paciente</h2>
            <div class="row">
                <div class="col">
                    <label>CPF Paciente:</label>
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="cpfPaciente" placeholder="Somente numeros (11 digitos)">
                        <button class="small" type="button" onclick="buscarPaciente()">Buscar</button>
                    </div>
                </div>
                <div class="col" style="flex: 2;">
                    <label>Nome do Paciente:</label>
                    <input type="text" id="nomePaciente" readonly placeholder="Busque pelo CPF...">
                </div>
            </div>
            <div id="statusPaciente" class="status"></div>
        </div>

        <div class="section">
            <h2>Diagnostico (CID)</h2>
            <div class="row">
                <div class="col">
                    <label>Codigo CID:</label>
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="codigoCid" placeholder="Ex: J00, G43, I10">
                        <button class="small" type="button" onclick="buscarCid()">Buscar</button>
                    </div>
                </div>
                <div class="col" style="flex: 3;">
                    <label>Descricao da Doenca:</label>
                    <input type="text" id="descricaoCid" readonly placeholder="Descricao sera preenchida automaticamente...">
                </div>
            </div>
            <div id="statusCid" class="status"></div>
        </div>

        <div class="section">
            <h2>Medicamentos Prescritos</h2>

            <div class="prescricao-form">
                <div>
                    <label>Medicamento:</label>
                    <select id="selectMedicamento">
                        <option value="">-- Carregando... --</option>
                    </select>
                </div>
                <div>
                    <label>Posologia:</label>
                    <input type="text" id="posologia" placeholder="Ex: 1 comp a cada 8h">
                </div>
                <div>
                    <label>Periodo:</label>
                    <input type="text" id="periodo" placeholder="Ex: 7 dias">
                </div>
                <div>
                    <button class="small add" onclick="adicionarPrescricao()">+ Adicionar</button>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th style="width: 30%;">Medicamento</th>
                        <th style="width: 35%;">Posologia</th>
                        <th style="width: 20%;">Periodo</th>
                        <th style="width: 15%;">Acao</th>
                    </tr>
                </thead>
                <tbody id="prescricoesBody">
                    <tr id="emptyRow">
                        <td colspan="4" style="text-align: center; color: #999;">Nenhum medicamento adicionado</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="actions">
            <button onclick="emitirReceita()">Emitir Receita</button>
        </div>

        <div id="statusGeral" class="status" style="margin-top: 20px;"></div>
    </div>

    <!-- ABA: Listar Receitas -->
    <div id="tab-listar" class="tab-content">
        <div class="section">
            <h2>Receitas Medicas Emitidas</h2>
            <button class="small" onclick="carregarListaReceitas()">Atualizar Lista</button>
            <div id="listaReceitas" style="margin-top: 15px;">
                <p style="color: #999;">Clique em "Atualizar Lista" para carregar...</p>
            </div>
        </div>
    </div>

    <!-- ABA: Buscar por Numero -->
    <div id="tab-buscar" class="tab-content">
        <div class="section">
            <h2>Buscar Receita por Numero</h2>
            <div class="row">
                <div class="col">
                    <label>Numero da Receita:</label>
                    <div style="display:flex; gap:5px;">
                        <input type="number" id="buscaNroReceita" placeholder="Ex: 1">
                        <button class="small" onclick="buscarReceitaPorNumero()">Buscar</button>
                    </div>
                </div>
            </div>
            <div id="resultadoBuscaReceita" style="margin-top: 15px;"></div>
        </div>
    </div>

    <!-- ABA: Cadastrar Paciente -->
    <div id="tab-cadastrar" class="tab-content">
        <div class="section">
            <h2>Dados Pessoais</h2>
            <div class="row">
                <div class="col">
                    <label>CPF (11 digitos):</label>
                    <input type="text" id="cadCpf" placeholder="Somente numeros" maxlength="11">
                </div>
                <div class="col" style="flex: 2;">
                    <label>Nome Completo:</label>
                    <input type="text" id="cadNome" placeholder="Nome completo do paciente">
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Contato</h2>
            <div class="row">
                <div class="col" style="flex: 0.4;">
                    <label>DDD:</label>
                    <input type="text" id="cadDDD" placeholder="Ex: 45" maxlength="3">
                </div>
                <div class="col">
                    <label>Telefone:</label>
                    <input type="text" id="cadTelefone" placeholder="Ex: 999001122" maxlength="15">
                </div>
                <div class="col">
                    <label>Email:</label>
                    <input type="email" id="cadEmail" placeholder="email@exemplo.com">
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Endereco</h2>
            <div class="row">
                <div class="col" style="flex: 0.5;">
                    <label>CEP:</label>
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="cadCep" placeholder="Ex: 85801000" maxlength="8">
                        <button class="small" type="button" onclick="buscarCEP()">Buscar</button>
                    </div>
                </div>
                <div class="col" style="flex: 2;">
                    <label>Logradouro:</label>
                    <input type="text" id="cadLogradouro" readonly placeholder="Preenchido via CEP">
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label>Bairro:</label>
                    <input type="text" id="cadBairro" readonly placeholder="Preenchido via CEP">
                </div>
                <div class="col">
                    <label>Cidade:</label>
                    <input type="text" id="cadCidade" readonly placeholder="Preenchido via CEP">
                </div>
                <div class="col" style="flex: 0.4;">
                    <label>Estado:</label>
                    <input type="text" id="cadEstado" readonly placeholder="UF" maxlength="2">
                </div>
            </div>
            <div class="row">
                <div class="col" style="flex: 0.5;">
                    <label>Numero:</label>
                    <input type="number" id="cadNumero" placeholder="Ex: 100">
                </div>
                <div class="col">
                    <label>Complemento:</label>
                    <input type="text" id="cadComplemento" placeholder="Apto, Sala, etc. (opcional)">
                </div>
            </div>
            <div id="statusCep" class="status"></div>
        </div>

        <div class="actions">
            <button onclick="cadastrarPaciente()">Cadastrar Paciente</button>
        </div>
        <div id="statusCadastro" class="status" style="margin-top: 20px;"></div>
    </div>

    <div class="actions nav-buttons">
        <a href="index.html"><button class="small" style="background:#7f8c8d;">Voltar ao Menu</button></a>
        <a href="chatbot.html"><button class="small chatbot">Assistente Virtual</button></a>
    </div>

    <script>
        const BASE_URL_RECEITA = 'http://localhost:8080/MyReceitaServicos/resources';

        let pacienteAtual = null;
        let cidAtual = null;
        let medicoAtual = null;
        let prescricoes = [];
        let medicamentosDisponiveis = [];
        let medicosDisponiveis = [];

        // Funcao helper para formatar data (corrige bug de Invalid Date)
        function formatarData(dataStr) {
            if (!dataStr) return 'N/A';
            // Remove [UTC] ou qualquer timezone entre colchetes
            const dataLimpa = dataStr.replace(/\[.*\]/, '');
            const data = new Date(dataLimpa);
            if (isNaN(data.getTime())) return 'N/A';
            return data.toLocaleDateString('pt-BR');
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('dataEmissao').valueAsDate = new Date();
            carregarMedicamentos();
            carregarMedicos();
        });

        // Carregar medicos
        async function carregarMedicos() {
            const select = document.getElementById('selectMedico');

            try {
                const response = await fetch(`${BASE_URL_RECEITA}/medico`);
                if (!response.ok) throw new Error('Erro ao carregar medicos');

                medicosDisponiveis = await response.json();

                select.innerHTML = '<option value="">-- Selecione um medico --</option>';
                medicosDisponiveis.forEach(m => {
                    select.innerHTML += `<option value="${m.idPessoa}">${m.nome}</option>`;
                });

                select.addEventListener('change', function() {
                    const medico = medicosDisponiveis.find(m => m.idPessoa === parseInt(this.value));
                    if (medico) {
                        medicoAtual = medico;
                        document.getElementById('crmMedico').value = medico.crm || '';
                    } else {
                        medicoAtual = null;
                        document.getElementById('crmMedico').value = '';
                    }
                });

            } catch (error) {
                select.innerHTML = '<option value="">Erro ao carregar medicos</option>';
            }
        }

        function trocarTab(nome) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + nome).classList.add('active');
        }

        async function buscarPaciente() {
            const cpf = document.getElementById('cpfPaciente').value.replace(/\D/g, '');
            const statusEl = document.getElementById('statusPaciente');

            if (cpf.length !== 11) {
                statusEl.className = 'status error';
                statusEl.textContent = 'CPF deve ter 11 digitos';
                return;
            }

            statusEl.className = 'status loading';
            statusEl.textContent = 'Buscando paciente...';

            try {
                const response = await fetch(`${BASE_URL_RECEITA}/paciente/cpf/${cpf}`);

                if (response.status === 404) {
                    statusEl.className = 'status error';
                    statusEl.textContent = 'Paciente nao encontrado no sistema';
                    limparPaciente();
                    return;
                }

                if (!response.ok) throw new Error('Erro ao buscar paciente');

                const paciente = await response.json();
                pacienteAtual = paciente;

                document.getElementById('nomePaciente').value = paciente.nome || '';
                document.getElementById('nomePaciente').classList.add('found');

                statusEl.className = 'status success';
                statusEl.textContent = 'Paciente encontrado!';

            } catch (error) {
                statusEl.className = 'status error';
                statusEl.textContent = 'Erro: ' + error.message;
                limparPaciente();
            }
        }

        function limparPaciente() {
            pacienteAtual = null;
            document.getElementById('nomePaciente').value = '';
            document.getElementById('nomePaciente').classList.remove('found');
        }

        async function buscarCid() {
            const codigo = document.getElementById('codigoCid').value.trim().toUpperCase();
            const statusEl = document.getElementById('statusCid');

            if (!codigo) {
                statusEl.className = 'status error';
                statusEl.textContent = 'Informe o codigo do CID';
                return;
            }

            statusEl.className = 'status loading';
            statusEl.textContent = 'Buscando CID...';

            try {
                const response = await fetch(`${BASE_URL_RECEITA}/cid/${codigo}`);

                if (response.status === 404) {
                    statusEl.className = 'status error';
                    statusEl.textContent = 'CID nao encontrado';
                    limparCid();
                    return;
                }

                if (!response.ok) throw new Error('Erro ao buscar CID');

                const cid = await response.json();
                cidAtual = cid;

                document.getElementById('codigoCid').value = cid.codigo;
                document.getElementById('descricaoCid').value = cid.descricao || '';
                document.getElementById('descricaoCid').classList.add('found');

                statusEl.className = 'status success';
                statusEl.textContent = 'CID encontrado!';

            } catch (error) {
                statusEl.className = 'status error';
                statusEl.textContent = 'Erro: ' + error.message;
                limparCid();
            }
        }

        function limparCid() {
            cidAtual = null;
            document.getElementById('descricaoCid').value = '';
            document.getElementById('descricaoCid').classList.remove('found');
        }

        async function carregarMedicamentos() {
            const select = document.getElementById('selectMedicamento');

            try {
                const response = await fetch(`${BASE_URL_RECEITA}/medicamento`);
                if (!response.ok) throw new Error('Erro ao carregar medicamentos');

                medicamentosDisponiveis = await response.json();

                select.innerHTML = '<option value="">-- Selecione um medicamento --</option>';
                medicamentosDisponiveis.forEach(m => {
                    const fabricante = m.fabricante ? ` (${m.fabricante})` : '';
                    select.innerHTML += `<option value="${m.idMedicamento}">${m.nomeGenerico}${fabricante}</option>`;
                });

            } catch (error) {
                select.innerHTML = '<option value="">Erro ao carregar medicamentos</option>';
            }
        }

        function adicionarPrescricao() {
            const select = document.getElementById('selectMedicamento');
            const idMed = parseInt(select.value);
            const posologia = document.getElementById('posologia').value.trim();
            const periodo = document.getElementById('periodo').value.trim();

            if (!idMed) { alert('Selecione um medicamento'); return; }
            if (!posologia) { alert('Informe a posologia'); return; }
            if (!periodo) { alert('Informe o periodo de uso'); return; }
            if (prescricoes.find(p => p.medicamento.idMedicamento === idMed)) { alert('Medicamento ja adicionado'); return; }

            const medicamento = medicamentosDisponiveis.find(m => m.idMedicamento === idMed);

            prescricoes.push({
                medicamento: medicamento,
                posologia: posologia,
                periodoUso: periodo
            });

            atualizarTabelaPrescricoes();

            select.value = '';
            document.getElementById('posologia').value = '';
            document.getElementById('periodo').value = '';
        }

        function removerPrescricao(idMed) {
            prescricoes = prescricoes.filter(p => p.medicamento.idMedicamento !== idMed);
            atualizarTabelaPrescricoes();
        }

        function atualizarTabelaPrescricoes() {
            const tbody = document.getElementById('prescricoesBody');

            if (prescricoes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #999;">Nenhum medicamento adicionado</td></tr>';
                return;
            }

            let html = '';
            prescricoes.forEach(p => {
                html += `<tr><td>${p.medicamento.nomeGenerico}</td><td>${p.posologia}</td><td>${p.periodoUso}</td><td style="text-align:center;"><button class="remove" onclick="removerPrescricao(${p.medicamento.idMedicamento})">Remover</button></td></tr>`;
            });

            tbody.innerHTML = html;
        }

        async function emitirReceita() {
            const statusEl = document.getElementById('statusGeral');
            const medicoId = document.getElementById('selectMedico').value;

            if (!medicoId) { statusEl.className = 'status error'; statusEl.textContent = 'Selecione um medico'; return; }
            if (!pacienteAtual) { statusEl.className = 'status error'; statusEl.textContent = 'Busque e selecione um paciente primeiro'; return; }
            if (prescricoes.length === 0) { statusEl.className = 'status error'; statusEl.textContent = 'Adicione pelo menos um medicamento'; return; }

            statusEl.className = 'status loading';
            statusEl.textContent = 'Emitindo receita medica...';

            const payload = {
                paciente: { idPessoa: pacienteAtual.idPessoa },
                medico: { idPessoa: parseInt(medicoId) },
                cid: cidAtual ? { codigo: cidAtual.codigo } : null,
                prescricoes: prescricoes.map(p => ({
                    medicamento: { idMedicamento: p.medicamento.idMedicamento },
                    posologia: p.posologia,
                    periodoUso: p.periodoUso
                }))
            };

            try {
                const response = await fetch(`${BASE_URL_RECEITA}/receita-medica/criar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || 'Erro ao emitir receita');
                }

                const result = await response.json();
                const nro = result.nroReceita || result.numeroReceita;
                document.getElementById('nroReceita').value = nro;
                statusEl.className = 'status success';
                statusEl.textContent = `Receita Medica #${nro} emitida com sucesso!`;

            } catch (error) {
                statusEl.className = 'status error';
                statusEl.textContent = 'Erro: ' + error.message;
            }
        }

        // Carregar lista de receitas
        async function carregarListaReceitas() {
            const container = document.getElementById('listaReceitas');
            container.innerHTML = '<p style="color:#856404;">Carregando...</p>';

            try {
                const response = await fetch(`${BASE_URL_RECEITA}/receita-medica`);
                if (!response.ok) throw new Error('Erro ao carregar receitas');

                const receitas = await response.json();

                if (receitas.length === 0) {
                    container.innerHTML = '<p style="color:#999;">Nenhuma receita medica encontrada.</p>';
                    return;
                }

                let html = '';
                receitas.forEach(r => {
                    const data = formatarData(r.dataEmissao);
                    html += `<div class="lista-item" onclick="exibirDetalhesReceita(${r.nroReceita || r.numeroReceita})">
                        <strong>Receita #${r.nroReceita || r.numeroReceita}</strong> - ${data}<br>
                        <small>Paciente: ${r.paciente?.nome || 'N/A'} | CID: ${r.cid?.codigo || 'N/A'}</small>
                    </div>`;
                });
                container.innerHTML = html;

            } catch (error) {
                container.innerHTML = `<p style="color:#721c24;">Erro: ${error.message}</p>`;
            }
        }

        // Buscar receita por numero
        async function buscarReceitaPorNumero() {
            const nro = document.getElementById('buscaNroReceita').value;
            const container = document.getElementById('resultadoBuscaReceita');

            if (!nro) { container.innerHTML = '<p style="color:#721c24;">Informe o numero da receita</p>'; return; }

            container.innerHTML = '<p style="color:#856404;">Buscando...</p>';

            try {
                const response = await fetch(`${BASE_URL_RECEITA}/receita-medica/${nro}`);

                if (response.status === 404) {
                    container.innerHTML = '<p style="color:#721c24;">Receita medica nao encontrada.</p>';
                    return;
                }

                if (!response.ok) throw new Error('Erro ao buscar receita');

                const receita = await response.json();
                exibirDetalhesReceitaNoContainer(receita, container);

            } catch (error) {
                container.innerHTML = `<p style="color:#721c24;">Erro: ${error.message}</p>`;
            }
        }

        function exibirDetalhesReceita(nro) {
            document.getElementById('buscaNroReceita').value = nro;
            trocarTab('buscar');
            document.querySelectorAll('.tab')[2].classList.add('active');
            document.querySelectorAll('.tab')[1].classList.remove('active');
            buscarReceitaPorNumero();
        }

        function exibirDetalhesReceitaNoContainer(receita, container) {
            const data = formatarData(receita.dataEmissao);
            let prescricoesHtml = receita.prescricoes?.map(p =>
                `<li><strong>${p.medicamento?.nomeGenerico || 'N/A'}</strong> - ${p.posologia} por ${p.periodoUso}</li>`
            ).join('') || '<li>Nenhuma</li>';

            container.innerHTML = `
                <div class="section">
                    <h2>Receita #${receita.nroReceita || receita.numeroReceita}</h2>
                    <p><strong>Data:</strong> ${data}</p>
                    <p><strong>Paciente:</strong> ${receita.paciente?.nome || 'N/A'}</p>
                    <p><strong>Medico:</strong> ${receita.medico?.nome || 'N/A'} (${receita.medico?.crm || 'N/A'})</p>
                    <p><strong>CID:</strong> ${receita.cid?.codigo || 'N/A'} - ${receita.cid?.descricao || ''}</p>
                    <p><strong>Prescricoes:</strong></p>
                    <ul>${prescricoesHtml}</ul>
                </div>
            `;
        }

        // ========== ABA: Cadastrar Paciente ==========

        async function buscarCEP() {
            const cep = document.getElementById('cadCep').value.replace(/\D/g, '');
            const statusEl = document.getElementById('statusCep');

            if (cep.length !== 8) {
                statusEl.className = 'status error';
                statusEl.textContent = 'CEP deve ter 8 digitos';
                return;
            }

            statusEl.className = 'status loading';
            statusEl.textContent = 'Buscando CEP...';

            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();

                if (data.erro) {
                    statusEl.className = 'status error';
                    statusEl.textContent = 'CEP nao encontrado';
                    return;
                }

                document.getElementById('cadLogradouro').value = data.logradouro || '';
                document.getElementById('cadBairro').value = data.bairro || '';
                document.getElementById('cadCidade').value = data.localidade || '';
                document.getElementById('cadEstado').value = data.uf || '';

                statusEl.className = 'status success';
                statusEl.textContent = 'CEP encontrado!';
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.textContent = 'Erro ao buscar CEP: ' + error.message;
            }
        }

        async function cadastrarPaciente() {
            const statusEl = document.getElementById('statusCadastro');

            const cpf = document.getElementById('cadCpf').value.replace(/\D/g, '');
            const nome = document.getElementById('cadNome').value.trim();
            const email = document.getElementById('cadEmail').value.trim();
            const ddd = document.getElementById('cadDDD').value.trim();
            const telefone = document.getElementById('cadTelefone').value.replace(/\D/g, '');
            const cep = document.getElementById('cadCep').value.replace(/\D/g, '');
            const logradouro = document.getElementById('cadLogradouro').value.trim();
            const bairro = document.getElementById('cadBairro').value.trim();
            const cidade = document.getElementById('cadCidade').value.trim();
            const estado = document.getElementById('cadEstado').value.trim();
            const numero = document.getElementById('cadNumero').value;
            const complemento = document.getElementById('cadComplemento').value.trim();

            if (cpf.length !== 11) {
                statusEl.className = 'status error';
                statusEl.textContent = 'CPF deve ter 11 digitos';
                return;
            }
            if (!nome) {
                statusEl.className = 'status error';
                statusEl.textContent = 'Informe o nome do paciente';
                return;
            }

            statusEl.className = 'status loading';
            statusEl.textContent = 'Cadastrando paciente...';

            const payload = {
                cpf: cpf,
                nome: nome,
                emails: email ? [{ enderecoEmail: email }] : [],
                telefones: telefone ? [{ numero: telefone, ddd: { codigo: ddd || '00' } }] : [],
                endereco: {
                    numero: parseInt(numero) || 0,
                    complemento: complemento || null,
                    endereco: cep ? {
                        cep: cep,
                        logradouro: { nome: logradouro },
                        bairro: { nome: bairro },
                        cidade: { nome: cidade, uf: { sigla: estado } }
                    } : null
                }
            };

            try {
                const response = await fetch(`${BASE_URL_RECEITA}/paciente/criar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || 'Erro ao cadastrar');
                }

                const result = await response.json();
                statusEl.className = 'status success';
                statusEl.textContent = `Paciente "${result.nome}" cadastrado com sucesso! ID: ${result.idPessoa}`;

                limparFormularioCadastro();
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.textContent = 'Erro: ' + error.message;
            }
        }

        function limparFormularioCadastro() {
            ['cadCpf', 'cadNome', 'cadEmail', 'cadDDD', 'cadTelefone', 'cadCep',
             'cadLogradouro', 'cadBairro', 'cadCidade', 'cadEstado', 'cadNumero', 'cadComplemento'
            ].forEach(id => { document.getElementById(id).value = ''; });
        }
    </script>
